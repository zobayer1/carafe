# Every job shells out to the Make targets a developer runs by hand, so each
# gate has one definition rather than a second one written in YAML that drifts.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. Pushing again cancels the run that is now answering a
# question about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both tools pinned to one LLVM release, from PyPI rather than apt. The runner
  # image ships an older LLVM than developers run, and version skew is a false
  # failure in both directions: clang-format is byte-exact, so two majors
  # disagree about code that is clean under either, and clang-tidy's checks are
  # added and refined between releases, so CI would report findings that cannot
  # be reproduced locally -- or miss the ones that can.
  LLVM_VERSION: "22.1.8"

jobs:
  test:
    name: ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    # A socket test can block on a peer that never speaks. Without a cap, one
    # deadlock burns the six-hour runner limit instead of failing in minutes.
    timeout-minutes: 15
    strategy:
      # Both compilers report: one failing must not hide the other's answer.
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # debug carries -Werror and release does not, so these are two
        # different questions rather than the same one asked twice.
        preset: [debug, release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache fetched GoogleTest
        uses: actions/cache@v6
        with:
          # FetchContent's stamps live here. Uncached, every job downloads and
          # builds GoogleTest before compiling a line of carafe. Only _deps is
          # cached, never CMakeCache.txt, so configuration still runs fresh.
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.compiler }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - run: make PRESET=${{ matrix.preset }} test

  asan:
    name: sanitizers
    runs-on: ubuntu-24.04
    # Instrumented builds run slower than the plain ones, and a leak report
    # arrives at exit rather than during the test that caused it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache fetched GoogleTest
        uses: actions/cache@v6
        with:
          path: build/asan/_deps
          key: deps-asan-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - run: make asan

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install clang-format==${{ env.LLVM_VERSION }}

      - run: make format-check

  tidy:
    runs-on: ubuntu-24.04
    # Builds the project first -- tidy reads compile_commands.json, so it costs
    # a full compile before it analyses anything.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The wheel carries run-clang-tidy too, so the Makefile takes its parallel
      # path and covers tests/ and examples/ rather than src/ alone.
      - run: pip install clang-tidy==${{ env.LLVM_VERSION }}

      - name: Cache fetched GoogleTest
        uses: actions/cache@v6
        with:
          path: build/debug/_deps
          key: deps-tidy-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - run: make tidy
